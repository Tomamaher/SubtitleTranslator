name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: List repo contents (debug)
        run: |
          echo "Repo root:"
          ls -la
          echo "All zip files found:"
          find . -iname "*.zip"

      - name: Unzip project
        run: |
          ZIPFILE=$(find . -maxdepth 3 -iname "*.zip" | head -n 1)
          if [ -z "$ZIPFILE" ]; then
            echo "No zip file found in repo!"
            exit 1
          fi
          echo "Unzipping $ZIPFILE"
          unzip -o "$ZIPFILE"

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v3

      - name: Build debug APK
        working-directory: SubtitleTranslator
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: SubtitleTranslator-debug-apk
          path: SubtitleTranslator/app/build/outputs/apk/debug/app-debug.apk
